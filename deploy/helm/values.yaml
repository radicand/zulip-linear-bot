replicaCount: 1

image:
  repository: ghcr.io/radicand/zulip-linear-bot
  pullPolicy: IfNotPresent
  tag: "0.1.0"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

podAnnotations: {}

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

existingSecret: zulip-linear-bot-secret

config:
  zulipBotName: linear
  linearTeamId: ""
  linearTeamKey: ""
